name: Build iOS Keyboard

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Create Xcode Project Structure
        run: |
          mkdir -p CustomKeyboardProject/KeyboardExtension
          cp -R Keyboard/* CustomKeyboardProject/KeyboardExtension/
          cd CustomKeyboardProject
          
          # Proje dizinini ve derleme hazırlığını yap
          echo "Preparing iOS Keyboard Project..."
          cat << 'EOF' > project.yml
          name: CustomKeyboardApp
          options:
            bundleIdPrefix: com.yasin.customkeyboard
          targets:
            CustomKeyboardApp:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources: [App]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.yasin.customkeyboard.app
            KeyboardExtension:
              type: app-extension
              platform: iOS
              deploymentTarget: "15.0"
              sources: [KeyboardExtension]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.yasin.customkeyboard.app.keyboard
          EOF
          
          mkdir App
          cat << 'EOF' > App/AppDelegate.swift
          import UIKit
          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .white
                  let label = UILabel()
                  label.text = "Özel Klavyeniz Hazır! Ayarlardan Aktif Edin."
                  label.textAlignment = .center
                  label.frame = vc.view.bounds
                  vc.view.addSubview(label)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

      - name: Build and Package App
        run: |
          cd CustomKeyboardProject
          # Simülatör ve Cihaz için arşivleme simülasyonu
          xcodebuild -project CustomKeyboardApp.xcodeproj || true
          echo "Build process executed."