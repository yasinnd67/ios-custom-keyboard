name: Build iOS Keyboard

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Keyboard Package
        run: |
          echo "Creating artifact directory..."
          mkdir -p output_keyboard
          
          # Klavye kaynak dosyalarını paketle
          cp -R Keyboard output_keyboard/
          
          cat << 'EOF' > output_keyboard/README.txt
          Özel iOS Klavyeniz Hazır!
          Bu klasör içindeki Swift dosyaları ve arayüz kodları başarıyla hazırlandı.
          EOF
          
          zip -r CustomKeyboard_Source.zip output_keyboard

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CustomKeyboard-Files
          path: CustomKeyboard_Source.zip