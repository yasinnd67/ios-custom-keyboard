name: Build iOS Keyboard IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Build App & Extension IPA
        run: |
          mkdir -p Payload/CustomKeyboard.app
          
          # Swift klavye kodunu derle
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-library \
                 Keyboard/KeyboardViewController.swift \
                 -o Payload/CustomKeyboard.app/CustomKeyboard
          
          # Minimal Info.plist yapısı oluştur
          cat << 'EOF' > Payload/CustomKeyboard.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CustomKeyboard</string>
              <key>CFBundleIdentifier</key>
              <string>com.yasin.customkeyboard</string>
              <key>CFBundleName</key>
              <string>CustomKeyboard</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # IPA Arşivi Oluştur
          zip -r CustomKeyboard.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomKeyboard-IPA
          path: CustomKeyboard.ipa