name: Build iOS Keyboard IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Valid Signed IPA Structure
        run: |
          # Klasör yapısını oluştur
          mkdir -p Payload/CustomKeyboard.app/PlugIns/KeyboardExtension.appex
          
          # 1. Klavye eklentisini derle
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -emit-library \
                 Keyboard/KeyboardViewController.swift \
                 -o Payload/CustomKeyboard.app/PlugIns/KeyboardExtension.appex/KeyboardExtension
          
          # 2. Ana uygulama için GERÇEK bir binary derle (imzalama hatasını çözer)
          echo 'print("App")' > main.swift
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 main.swift \
                 -o Payload/CustomKeyboard.app/CustomKeyboardApp
          rm main.swift
          
          # 3. Ana uygulama Info.plist
          cat << 'EOF' > Payload/CustomKeyboard.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>CustomKeyboardApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.yasin.customkeyboard</string>
              <key>CFBundleName</key>
              <string>CustomKeyboard</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # 4. Klavye eklentisi Info.plist
          cat << 'EOF' > Payload/CustomKeyboard.app/PlugIns/KeyboardExtension.appex/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>KeyboardExtension</string>
              <key>CFBundleIdentifier</key>
              <string>com.yasin.customkeyboard.extension</string>
              <key>CFBundleName</key>
              <string>KeyboardExtension</string>
              <key>CFBundlePackageType</key>
              <string>XPC!</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>NSExtension</key>
              <dict>
                  <key>NSExtensionAttributes</key>
                  <dict>
                      <key>IsASCIICapable</key>
                      <false/>
                      <key>PrefersRightToLeft</key>
                      <false/>
                      <key>PrimaryLanguage</key>
                      <string>tr</string>
                      <key>RequestsOpenAccess</key>
                      <true/>
                  </dict>
                  <key>NSExtensionPointIdentifier</key>
                  <string>com.apple.keyboard-service</string>
                  <key>NSExtensionPrincipalClass</key>
                  <string>Keyboard.KeyboardViewController</string>
              </dict>
          </dict>
          </plist>
          EOF

          # 5. IPA Paketini Arşivle
          zip -r CustomKeyboard.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomKeyboard-IPA
          path: CustomKeyboard.ipa