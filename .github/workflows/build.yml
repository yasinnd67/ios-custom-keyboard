name: Build iOS Keyboard IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: CustomKeyboard
          options:
            bundleIdPrefix: com.yasin.customkeyboard
            deploymentTarget:
              iOS: "15.0"
          targets:
            CustomKeyboard:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: Keyboard
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.yasin.customkeyboard.app
                GENERATE_INFOPLIST_FILE: YES
                CURRENT_PROJECT_VERSION: 1
                MARKETING_VERSION: "1.0"
                DEVELOPMENT_TEAM: ""
                CODE_SIGNING_ALLOWED: "NO"
          EOF
          xcodegen generate

      - name: Build App with xcodebuild
        run: |
          xcodebuild build \
            -project CustomKeyboard.xcodeproj \
            -scheme CustomKeyboard \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CustomKeyboard.app Payload/
          zip -r CustomKeyboard.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomKeyboard-IPA
          path: CustomKeyboard.ipa