name: Build iOS Keyboard IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen version

      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -d CustomKeyboard.xcodeproj

      - name: Build app and keyboard extension
        run: |
          set -euo pipefail
          xcodebuild \
            -project CustomKeyboard.xcodeproj \
            -scheme CustomKeyboardApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Validate iOS app bundle before packaging
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/CustomKeyboard.app"
          EXT="$APP/PlugIns/KeyboardExtension.appex"
          test -d "$APP"
          test -d "$EXT"
          plutil -lint "$APP/Info.plist"
          plutil -lint "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -Fx 'com.apple.keyboard-service'
          PRINCIPAL=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$EXT/Info.plist")
          echo "Principal class: $PRINCIPAL"
          test "$PRINCIPAL" = 'KeyboardExtension.KeyboardViewController'
          APP_BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          EXT_BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")
          test -f "$APP/$APP_BIN"
          test -f "$EXT/$EXT_BIN"
          file "$APP/$APP_BIN"
          file "$EXT/$EXT_BIN"
          lipo -verify_arch arm64 "$APP/$APP_BIN"
          lipo -verify_arch arm64 "$EXT/$EXT_BIN"

      - name: Package unsigned IPA for Sideloadly
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/CustomKeyboard.app"
          mkdir -p package/Payload
          ditto "$APP" package/Payload/CustomKeyboard.app
          (cd package && /usr/bin/zip -qry "$GITHUB_WORKSPACE/CustomKeyboard.ipa" Payload)
          test -s CustomKeyboard.ipa
          unzip -t CustomKeyboard.ipa
          unzip -l CustomKeyboard.ipa | grep -F 'Payload/CustomKeyboard.app/PlugIns/KeyboardExtension.appex/Info.plist'

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomKeyboard-IPA
          path: CustomKeyboard.ipa
          if-no-files-found: error
          retention-days: 7
